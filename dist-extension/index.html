    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LnkLokr — Save links with images" />
    <meta name="twitter:description" content="Save, organize, and sync your links with images across all devices. Keep · Borrow · Share · Bury — your personal content vault." />

    <script type="module" crossorigin src="./main2.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var h = window.location.hash || '';
        var s = window.location.search || '';
        var isRecovery =
          h.indexOf('type=recovery') !== -1 ||
          h.indexOf('access_token') !== -1 ||
          s.indexOf('type=recovery') !== -1 ||
          (s.indexOf('code=') !== -1 && window.location.pathname.indexOf('reset') !== -1);
        if (!isRecovery) return;
        try {
          sessionStorage.setItem('lnklokr_password_recovery', '1');
        } catch (e) {}
        if (window.location.pathname.indexOf('reset-password') === -1) {
          window.location.replace('/reset-password' + s + h);
        }
      })();

      (function () {
        var h = window.location.hash || '';
        if (h.indexOf('error=') === -1) return;
        if (window.location.pathname.indexOf('reset-password') === -1) {
          window.location.replace('/reset-password' + h);
        }
      })();
    </script>
  </body>
</html>
